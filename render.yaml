# Blueprint de Render (https://render.com/docs/blueprint-spec) — despliegue
# reproducible del backend. Crear el servicio vía "New > Blueprint" en el
# dashboard de Render apuntando a este repo hace que Render lea este archivo
# solo; los env vars marcados `sync: false` no tienen valor aquí a propósito
# (son secretos) — Render pide llenarlos a mano una vez, en su dashboard.
services:
  - type: web
    name: agrolink-api
    runtime: node
    plan: free
    branch: JosephBranch
    # `npm install` en vez de `npm ci`: ya nos mordió una vez un lockfile
    # marcado como "en sync" localmente pero rechazado por un npm distinto
    # en Render (paquetes opcionales de plataforma, ver historial). `install`
    # tolera esa clase de drift en vez de fallar el build entero por eso.
    # `--include=dev`: con NODE_ENV=production (necesario en runtime, ver
    # envVars abajo) npm omite devDependencies por defecto — y ahí vive
    # @nestjs/cli/typescript, que `nest build` sí necesita.
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      - key: API_VERSION
        value: v1
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: THROTTLE_TTL
        value: "60000"
      - key: THROTTLE_LIMIT
        value: "100"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_HNL_TO_USD_RATE
        value: "24.70"
      # URL pública de este mismo servicio — PayPal la necesita como
      # return_url/cancel_url del checkout redirigido (ver
      # payments/paypal-payments.service.ts). Debe coincidir con la URL real
      # que Render asigna al servicio.
      - key: API_PUBLIC_URL
        value: https://agrolink-api-we44.onrender.com
    # `PORT` NO se declara — Render lo inyecta solo y `main.ts` ya lee
    # `process.env.PORT`, fijarlo aquí lo pisaría con un valor incorrecto.
